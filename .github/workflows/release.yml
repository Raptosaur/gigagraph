name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf gigagraph-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release gigagraph
          shasum -a 256 gigagraph-${{ matrix.target }}.tar.gz \
            > gigagraph-${{ matrix.target }}.tar.gz.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/gigagraph.exe" `
            -DestinationPath "gigagraph-${{ matrix.target }}.zip"
          (Get-FileHash "gigagraph-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower() `
            + "  gigagraph-${{ matrix.target }}.zip" `
            | Out-File -Encoding ascii "gigagraph-${{ matrix.target }}.zip.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gigagraph-${{ matrix.target }}.tar.gz
            gigagraph-${{ matrix.target }}.tar.gz.sha256
            gigagraph-${{ matrix.target }}.zip
            gigagraph-${{ matrix.target }}.zip.sha256
          generate_release_notes: true

  publish-crate:
    runs-on: ubuntu-latest
    needs: build
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
            exit 0
          fi
          cargo publish
