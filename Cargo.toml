[package]
name = "gigagraph"
version = "0.7.0"
edition = "2024"
description = "Semantic code-graph MCP server for coding agents: call graphs, structural similarity, API endpoint maps, blast radius"
license = "MIT"
repository = "https://github.com/Raptosaur/gigagraph"
readme = "README.md"
keywords = ["mcp", "code-analysis", "tree-sitter", "call-graph", "ai"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
bincode = "1"
clap = { version = "4.6.6", features = ["derive"] }
hcl-rs = "0.19"
ignore = "0.4.33"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9"
streaming-iterator = "0.1.9"
tree-sitter = "0.26.11"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-graphql = "0.1.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-objc = "3.0.2"
tree-sitter-php = "0.24.2"
tree-sitter-prisma-io = "1.6.0"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
