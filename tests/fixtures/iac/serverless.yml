service: iac-demo

provider:
  name: aws
  runtime: nodejs20.x

functions:
  createUser:
    handler: src/handlers/users.create
    events:
      - http:
          path: users
          method: post
  report:
    handler: src/handlers/report.lambda_handler
    runtime: python3.12
    events:
      - httpApi: 'GET /reports'
  site:
    handler: src/handlers/users.create
    url: true
  # v1-era shorthand: no leading slash on the path.
  legacyList:
    handler: src/handlers/users.create
    events:
      - http: GET legacy
  # v1 greedy proxy path + integration/request sub-keys (route-irrelevant).
  assetsProxy:
    handler: src/handlers/users.create
    events:
      - http:
          path: /assets/{proxy+}
          method: any
          integration: lambda-proxy
          request:
            parameters:
              paths:
                proxy: true
  # Older httpApi catch-all spelling.
  catchAll:
    handler: src/handlers/users.create
    events:
      - httpApi: '*'

appSync:
  name: demo-api
  resolvers:
    Query.getReport:
      dataSource: reports
      kind: UNIT
