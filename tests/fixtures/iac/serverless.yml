service: iac-demo

provider:
  name: aws
  runtime: nodejs20.x

functions:
  createUser:
    handler: src/handlers/users.create
    events:
      - http:
          path: users
          method: post
  report:
    handler: src/handlers/report.lambda_handler
    runtime: python3.12
    events:
      - httpApi: 'GET /reports'
  site:
    handler: src/handlers/users.create
    url: true
  # v1-era shorthand: no leading slash on the path.
  legacyList:
    handler: src/handlers/users.create
    events:
      - http: GET legacy
  # v1 greedy proxy path + integration/request sub-keys (route-irrelevant).
  assetsProxy:
    handler: src/handlers/users.create
    events:
      - http:
          path: /assets/{proxy+}
          method: any
          integration: lambda-proxy
          request:
            parameters:
              paths:
                proxy: true
  # Older httpApi catch-all spelling.
  catchAll:
    handler: src/handlers/users.create
    events:
      - httpApi: '*'
  # ${self:...} one-level resolution against this document.
  varPath:
    handler: ${self:custom.handlers.users}
    events:
      - http:
          path: ${self:custom.basePath}/profiles
          method: get
  # ${opt:...} with a default literal.
  optStage:
    handler: src/handlers/users.create
    events:
      - http:
          path: /stage/${opt:stage, 'dev'}/info
          method: get
  # Unresolvable self: path stays raw.
  unresolvedVar:
    handler: src/handlers/users.create
    events:
      - http:
          path: /raw/${self:custom.missing}/x
          method: get
  # Nested variables stay raw.
  nestedVar:
    handler: src/handlers/users.create
    events:
      - http:
          path: /n/${self:custom.${opt:k}}/y
          method: get

custom:
  basePath: /v1
  handlers:
    users: src/handlers/users.create

appSync:
  name: demo-api
  resolvers:
    Query.getReport:
      dataSource: reports
      kind: UNIT
